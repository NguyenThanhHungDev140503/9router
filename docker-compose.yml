services:
  9router-dev:
    image: ${IMAGE_REGISTRY:-}9router:${IMAGE_TAG:-latest}
    container_name: 9router-dev
    restart: always
    ports:
      - "${ROUTER_PORT:-20130}:20128"
    volumes:
      - 9router-dev-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: ${HEADROOM_URL:-http://headroom:8787}
    networks:
      - 9router_net

volumes:
  9router-dev-data:
    name: 9router-dev-data

networks:
  9router_net:
    external: true
