name: Build and Deploy to VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  VPS_APP_DIR: /opt/9router-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_prefix: ${{ steps.prefix.outputs.prefix }}

    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set image prefix lowercase
        id: prefix
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LOWER}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prefix.outputs.prefix }}/9router:${{ steps.image.outputs.tag }}
            ${{ steps.prefix.outputs.prefix }}/9router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H 160.250.4.40 >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Sync deployment configs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || 'root@160.250.4.40' }}
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$VPS_HOST" \
            "install -d -m 0755 ${{ env.VPS_APP_DIR }}"
          rsync -az --info=progress2 \
            --exclude='.env' --exclude='node_modules/' \
            -e 'ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' \
            docker-compose.yml .env.defaults \
            "$VPS_HOST:${{ env.VPS_APP_DIR }}/"

      - name: Pull and start container with rollback protection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || 'root@160.250.4.40' }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_PREFIX='$IMAGE_PREFIX' VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VPS_APP_DIR"

          previous_tag=""
          rollback_armed=false

          wait_for_health() {
            local port="$(grep '^ROUTER_PORT=' .env 2>/dev/null | cut -d= -f2 || echo '20130')"
            for _ in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/api/health" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          rollback_on_error() {
            local failed_status="$1"
            trap - ERR
            set +e

            if [[ "$rollback_armed" != true ]]; then
              echo "Deploy failed before previous tag recorded; skipping rollback." >&2
              exit "$failed_status"
            fi

            echo "Deploy failed; rolling back to: $previous_tag" >&2
            sed -i '/^IMAGE_REGISTRY=/d; /^IMAGE_TAG=/d' .env
            printf 'IMAGE_REGISTRY=%s/\nIMAGE_TAG=%s\n' "$IMAGE_PREFIX" "$previous_tag" >> .env

            docker compose pull && docker compose up -d --no-build && wait_for_health
            exit "$failed_status"
          }

          trap 'rollback_on_error $?' ERR

          if [[ ! -f .env ]]; then
            cat .env.defaults > .env
            chmod 600 .env
          fi

          previous_tag="$(sed -n 's/^IMAGE_TAG=//p' .env | tail -1)"
          if [[ -n "$previous_tag" ]]; then
            printf '%s\n' "$previous_tag" > .last-deploy
            rollback_armed=true
          fi

          sed -i '/^IMAGE_REGISTRY=/d; /^IMAGE_TAG=/d' .env
          printf 'IMAGE_REGISTRY=%s/\nIMAGE_TAG=%s\n' "$IMAGE_PREFIX" "$IMAGE_TAG" >> .env

          docker compose config --quiet
          docker compose pull
          docker compose up -d --no-build

          wait_for_health
          trap - ERR
          echo "Deploy 9router completed successfully."
          REMOTE

